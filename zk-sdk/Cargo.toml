[package]
name = "solana-zk-sdk"
description = "Solana ZK SDK"
documentation = "https://docs.rs/solana-zk-sdk"
version = "8.1.0"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
aes-gcm-siv = { workspace = true }
base64 = { workspace = true }
bytemuck = { workspace = true }
getrandom = { workspace = true }
hkdf = { workspace = true }
itertools = { workspace = true }
merlin = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
shake = { workspace = true }
solana-address = { workspace = true, features = ["bytemuck"] }
solana-derivation-path = { workspace = true }
solana-ed25519 = { workspace = true, features = ["serde"] }
solana-seed-derivable = { workspace = true }
solana-seed-phrase = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-zk-elgamal-proof-interface = { workspace = true }
solana-zk-sdk-pod = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true, features = ["std"] }
zeroize = { workspace = true, features = ["zeroize_derive"] }

[dev-dependencies]
bincode = { workspace = true }
bip39 = { workspace = true }
criterion = { workspace = true }
solana-address = { workspace = true, features = ["atomic", "bytemuck"] }
solana-keypair = { workspace = true }

[[bench]]
name = "encryption"
harness = false

[[bench]]
name = "range_proof"
harness = false

[[bench]]
name = "sigma_proofs"
harness = false

[lints]
workspace = true
